<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 440px; height: 280px; overflow: hidden; color: #fff; font-family: "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at 85% 20%, #a23b72 0%, transparent 55%), radial-gradient(circle at 10% 100%, #5b2a86 0%, transparent 60%), #0b0b0f; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; }
  .top { display: flex; align-items: center; gap: 14px; }
  img { width: 64px; }
  h1 { font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -.5px; }
  p { margin-top: 18px; font-size: 18px; color: #ccc; }
  .pill { display: inline-block; margin-top: 18px; background: #ed4956; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 15px; align-self: flex-start; }
</style></head>
<body>
  <div class="top"><img src="../../extension/icons/icon128.png"><h1>Reels<br>Quick Block</h1></div>
  <p>Block accounts without leaving the reel.</p>
  <div class="pill">🚫 Block @account</div>
</body></html>
